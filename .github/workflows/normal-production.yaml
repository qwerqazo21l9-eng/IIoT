name: Normal production acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start actual protocol and storage services
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 180
      - name: Actual OPC UA and EdgeX contract
        run: python -m unittest ingestion/test_protocol.py -v
      - name: Simulator and HTTP full-path acceptance
        run: mvn -B -ntp -P integration verify
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p target
          docker compose -f deploy/compose.yaml logs --no-color > target/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-production-evidence
          path: |
            simulator/target/surefire-reports/
            production-service/target/failsafe-reports/
            target/normal-demo-result.json
            target/compose.log
      - name: Stop acceptance services
        if: always()
        run: docker compose -f deploy/compose.yaml down
