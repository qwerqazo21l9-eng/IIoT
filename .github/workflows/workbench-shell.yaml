name: Workbench shell acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-workbench/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-shell-evidence
          path: |
            docs/evidence/issue-3/
            web-workbench/test-results/
