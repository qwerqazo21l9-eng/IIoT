server.port=${IIOT_PORT:18085}
server.error.include-message=always
spring.datasource.url=${IIOT_DATABASE:jdbc:postgresql://localhost:15432/iiot}
spring.datasource.username=iiot
spring.datasource.password=iiot-local
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=always
iiot.kafka=${IIOT_KAFKA:localhost:19092}
iiot.bridge=${IIOT_BRIDGE:http://127.0.0.1:18084}
logging.level.org.apache.flink=WARN
logging.level.org.apache.kafka=WARN
